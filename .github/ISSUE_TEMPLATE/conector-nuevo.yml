name: Proponer un conector nuevo
description: Antes de escribir código, acordemos el proveedor y su alcance.
labels: ["propuesta"]
body:
  - type: markdown
    attributes:
      value: |
        Lee [CONTRIBUTING.md](https://github.com/arkanaio/alma-plugins/blob/main/CONTRIBUTING.md) antes de rellenar esto. Una propuesta aceptada evita escribir un conector que luego no se puede aceptar.
  - type: input
    id: proveedor
    attributes:
      label: Proveedor
      placeholder: Slack, Figma, Atlassian...
    validations:
      required: true
  - type: checkboxes
    id: capacidades
    attributes:
      label: Capacidades que sincronizaría
      options:
        - label: Licencias (contratos y puestos ocupados)
        - label: Directorio (lista de empleados)
        - label: Dispositivos (inventario de equipos)
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: Documentación de la API del proveedor
      description: Si el proveedor no ofrece una vía programática, dilo aquí. Ese caso no es este repositorio todavía.
    validations:
      required: true
  - type: textarea
    id: credencial
    attributes:
      label: Credencial y permisos
      description: Qué hay que crear en el proveedor y con qué permisos mínimos de solo lectura.
    validations:
      required: true
  - type: dropdown
    id: actividad
    attributes:
      label: ¿El proveedor publica la última actividad de uso?
      description: Es opcional. Un conector de licencias sin actividad es igual de válido.
      options:
        - "No la publica"
        - "Sí, y sé de qué campo sale"
        - "No lo sé todavía"
    validations:
      required: true
  - type: textarea
    id: actividad-detalle
    attributes:
      label: Qué mide esa actividad
      description: Solo si has respondido que sí. Di qué campo es y qué mide exactamente. La fecha de sincronización, la de asignación o un acceso genérico a la cuenta no son uso de una licencia.
  - type: textarea
    id: limites
    attributes:
      label: Límites conocidos
      description: Cuotas, paginación, retardos, campos que el proveedor no ofrece.
  - type: checkboxes
    id: compromiso
    attributes:
      label: Antes de enviar
      options:
        - label: He leído la guía de contribución y el contrato de conector.
          required: true
        - label: No voy a incluir credenciales ni datos de personas reales en el código ni en los datos de ejemplo.
          required: true

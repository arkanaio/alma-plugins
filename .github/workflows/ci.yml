name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Use GitHub-hosted runners for pull requests, including contributions from forks.
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Without --frozen-lockfile a contribution could resolve versions other
      # than the reviewed ones.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm biome ci .
      - run: pnpm tsc --noEmit
      # Tests run against each connector's sample data. This job holds no
      # provider credential, and it must not hold one.
      - run: pnpm test
      # Every accepted review on record is complete and signed. It catches the
      # verdict that names one reviewer for a community connector, or leaves a
      # box unchecked, while the pull request that brings it is still open.
      - run: pnpm review

  # Every commit in a pull request certifies its origin with a Signed-off-by
  # trailer (DCO 1.1). There is no CLA: Apache 2.0 section 5 already places a
  # contribution under the same license, and what the sign-off adds is the
  # author's statement that the code is theirs to contribute. See
  # CONTRIBUTING.md#license-and-sign-off.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The whole range between base and head has to be readable, so the default
      # shallow clone is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./.github/scripts/check-dco.sh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

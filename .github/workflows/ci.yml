name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run on the organisation's own runners (the "alma" label), the same ones
# arkanaio/alma uses. To fall back to GitHub-hosted runners, set the repository
# variable CI_RUNS_ON to "ubuntu-latest", quoted, because it is read as JSON.
#
# That variable has to be set before this repository is made public. The
# organisation's runner group has allows_public_repositories set to false, which
# is exactly right: a self-hosted runner executing a pull request from a fork is
# running unreviewed code on the organisation's machine, and receiving pull
# requests from forks is what this repository exists for. Actions is free on
# public repositories, so the switch costs nothing.
jobs:
  verify:
    name: verify
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","alma"]') }}
    steps:
      - uses: actions/checkout@v4
      # The organisation's runners share a HOME: the action reinstalls pnpm into
      # dest on start, and two self-installs at once over the same directory
      # corrupt it. Each instance uses its own; GitHub-hosted runners keep the
      # default destination. Same reasoning as arkanaio/alma.
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.environment == 'self-hosted' && format('~/setup-pnpm/{0}', runner.name) || '~/setup-pnpm' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Without --frozen-lockfile a contribution could resolve versions other
      # than the reviewed ones.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm biome ci .
      - run: pnpm tsc --noEmit
      # Tests run against each connector's sample data. This job holds no
      # provider credential, and it must not hold one.
      - run: pnpm test

  # Every commit in a pull request certifies its origin with a Signed-off-by
  # trailer (DCO 1.1). There is no CLA: Apache 2.0 section 5 already places a
  # contribution under the same license, and what the sign-off adds is the
  # author's statement that the code is theirs to contribute. See
  # CONTRIBUTING.md#license-and-sign-off.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","alma"]') }}
    steps:
      # The whole range between base and head has to be readable, so the default
      # shallow clone is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./.github/scripts/check-dco.sh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

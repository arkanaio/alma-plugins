name: Publish

# Until 1.0.0, every merge to main publishes. A pull request that bumps a
# package's version publishes it when it lands; one that does not publishes
# nothing, because there is nothing new to publish. The security review is
# demanded from 1.0.0 on, by check-reviews.mjs, so the relaxation expires by
# itself with the first 1.0.0 of each package. See docs/SECURITY-REVIEW.md,
# "Before 1.0.0".
#
# The manual dispatch publishes the same set, for retrying a run that failed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in a row must not race to publish the same version.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  # Lets npm record provenance: a signed attestation tying the published
  # tarball to this repository, this workflow and this commit. Anyone
  # installing a connector can then check that what they got was built here,
  # which is the whole claim this repository makes.
  id-token: write

jobs:
  publish:
    name: publish
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nothing is published that has not passed the same checks as a PR.
      - run: pnpm verify
      - name: Find the versions not on npm yet
        id: pending
        run: |
          packages="$(node .github/scripts/unpublished-packages.mjs)"
          echo "Pending: ${packages:-nothing}"
          {
            echo "packages<<EOF"
            echo "$packages"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # From 1.0.0 on, nothing is published that has not passed its security
      # review: the version in the package's package.json must have an accepted
      # review in reviews/, signed by the people its support level requires.
      # Below 1.0.0 the script lets it through. See docs/SECURITY-REVIEW.md.
      - name: Check the reviews
        if: steps.pending.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.pending.outputs.packages }}
        run: |
          while read -r package; do
            node .github/scripts/check-reviews.mjs --package "$package"
          done <<< "$PACKAGES"
      # Authentication uses the per-package npm trusted publisher configured
      # for this repository, publish.yml and the publish environment. No static
      # npm token is passed to the job. Provenance binds the tarball to this run.
      #
      # pnpm publishes the filtered packages in dependency order, so a contract
      # raised in the same merge as the connector that needs it goes first.
      - name: Publish the packages
        if: steps.pending.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.pending.outputs.packages }}
        run: |
          filters=()
          while read -r package; do
            filters+=(--filter "$package")
          done <<< "$PACKAGES"
          pnpm -r "${filters[@]}" publish --access public --no-git-checks --provenance

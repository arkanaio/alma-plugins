name: Publish

# Publishing is deliberately manual. A connector reaches ALMA because someone
# reviewed it and wrote its incorporation record, so the version that leaves
# this repository is a decision, never the side effect of a merge.
on:
  workflow_dispatch:
    inputs:
      package:
        description: The workspace package to publish.
        required: true
        type: string

permissions:
  contents: read
  # Lets npm record provenance: a signed attestation tying the published
  # tarball to this repository, this workflow and this commit. Anyone
  # installing a connector can then check that what they got was built here,
  # which is the whole claim this repository makes.
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","alma"]') }}
    environment: publish
    steps:
      - uses: actions/checkout@v4
      # The organisation's runners share a HOME: the action reinstalls pnpm into
      # dest on start, and two self-installs at once over the same directory
      # corrupt it. Each instance uses its own; GitHub-hosted runners keep the
      # default destination. Same reasoning as arkanaio/alma.
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.environment == 'self-hosted' && format('~/setup-pnpm/{0}', runner.name) || '~/setup-pnpm' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Public npm, not GitHub Packages. The contract is the interface
          # anyone writing a connector compiles against, and GitHub Packages
          # asks for a personal token even to read a public package: that is a
          # barrier in front of the one package that must not have one.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Nothing is published that has not passed the same checks as a PR.
      - run: pnpm verify
      # Provenance only on GitHub-hosted runners: npm rejects an attestation
      # built anywhere else, because an attestation is worth exactly as much as
      # the verifiability of the machine that made it. The organisation's own
      # runners are used while this repository is private and its Actions
      # billing is blocked; the day CI_RUNS_ON switches to ubuntu-latest for
      # going public, provenance turns on by itself.
      - name: Publish the package
        run: >-
          pnpm --filter ${{ inputs.package }} publish
          --access public --no-git-checks
          ${{ runner.environment == 'github-hosted' && '--provenance' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
